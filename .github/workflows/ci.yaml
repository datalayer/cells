# Lints, type-checks, builds and tests the package on every push and pull
# request to main. `@datalayer/reactor` comes from npm here (a dev dependency
# and a peer); in the Datalayer monorepo it is the workspace's checkout.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The bench step reads the last main run's result (an artifact) as its base.
  actions: read

jobs:
  typescript:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # React 18 is installed beside React 19 (react-18, react-dom-18) to test
      # the hooks against both; its peer on react 18 is what the flag accepts.
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint (Prettier, headers)
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build the package (lib/)
        run: npm run build

      - name: The built core loads in plain Node
        run: npm run check:node

      # The monkey party's Python peer (src/collab/__tests__/monkeyPython.test.ts) runs
      # datalayer_cells over loro-py: without them that test skips.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The live workbook's e2e (e2e/liveWorkbook.spec.ts) runs code cells on a local Jupyter
      # server's kernel, which imports datalayer_cells and pandas.
      - name: The Python peer of the monkey party, and the kernel of the code cells' e2e
        run: python -m pip install -e ".[live]" jupyter-server ipykernel pandas

      - name: Test
        run: npm test

      - name: Build and test the Docusaurus integration (against lib/, built above)
        working-directory: integrations/docusaurus
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build
          npm test

      # The sample site on this checkout's packed packages, for its e2e (e2e/docusaurus.spec.ts).
      - name: Build the Docusaurus sample site
        working-directory: integrations/docusaurus/site
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run install:local
          npm run build

      # The examples, the charts, two pages in one collaboration room, the code cells' frames
      # and the sample site; a missing site build fails rather than skips.
      - name: The examples, opened in Chrome (the runner's /usr/bin/google-chrome)
        run: npm run e2e
        env:
          CELLS_DOCUSAURUS_SITE: '1'
          # The live workbook's e2e starts `jupyter server`: without one it fails rather than skips.
          CELLS_CODE_KERNEL: '1'
          # The screenshot suite compares with e2e/__screenshots__, written by CI's own run 40925611269
          # (CELLS_SCREENSHOTS_WRITE=1). When the chrome changes on purpose, set it for one run,
          # take the e2e-screenshots artifact, look at it, and commit it.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/__screenshots__/
          if-no-files-found: ignore

      # What Playwright kept of a failed flow: its ARIA snapshot of the page and screenshots.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore

      - name: Bundle sizes against their budgets
        run: npm run size

      # The budgets (bench/budgets.json) hold every figure; the last main run's
      # result is the base a regression of more than 15 % is measured against;
      # and a copy of this run's result with 20 % injected into every figure
      # must fail the same gate, so the gate is proven on every run. A timing
      # over its budget is measured again, up to three runs in all, and its
      # best run is gated (the runner is shared: a busy neighbour slows one run).
      - name: Bench, against the budgets, the last main run, and an injected regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm run bench -- --attempts 3
          current="$(ls -t bench/results/*.json | head -1)"
          node scripts/size.mjs --json > bench/results/sizes.json 2>/dev/null
          node -e "
            const fs = require('fs');
            const current = JSON.parse(fs.readFileSync('$current'));
            const sizes = JSON.parse(fs.readFileSync('bench/results/sizes.json'));
            Object.assign(current.figures, sizes.figures);
            fs.writeFileSync('bench/results/current.json', JSON.stringify(current, null, 2) + '\n');
          "
          base=""
          run="$(gh run list --workflow ci.yaml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          if [ -n "$run" ] && gh run download "$run" -n bench-result -D bench/base 2>/dev/null; then
            # Gated against the base: the bundle sizes, which are exact. The timings of a shared
            # runner move by more than 15 % between runs, so against the base they are reported
            # (below), and gated by their budgets only.
            node -e "
              const fs = require('fs');
              const base = JSON.parse(fs.readFileSync('bench/base/current.json'));
              base.figures = Object.fromEntries(Object.entries(base.figures).filter(([k]) => k.startsWith('bundle.')));
              fs.writeFileSync('bench/base/sizes.json', JSON.stringify(base));
            "
            base="bench/base/sizes.json"
            echo "base: the result of main run $run"
            node scripts/bench-compare.mjs bench/results/current.json bench/base/current.json --threshold 0.15 || true
          else
            echo "base: none (no earlier main run holds a result); budgets only"
          fi
          node scripts/bench-compare.mjs bench/results/current.json $base --threshold 0.15
          node scripts/bench-inject.mjs bench/results/current.json bench/results/injected.json --fraction 0.2
          if node scripts/bench-compare.mjs bench/results/injected.json bench/results/current.json --threshold 0.15; then
            echo "the regression gate let a 20 % regression through"
            exit 1
          fi
          echo "the regression gate refused the injected 20 % regression"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: bench/results/current.json

      - name: What npm would publish
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json'))[0].files.map(f => f.path);
            const bad = files.filter(p => !/^(lib|style)\//.test(p) && !['package.json','README.md','LICENSE'].includes(p));
            if (bad.length) { console.error('npm pack carries files outside lib/ and style/:', bad); process.exit(1); }
            console.log(files.length + ' files, all under lib/, style/ or top-level');
          "

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: The command
        run: |
          datalayer-cells --help
          datalayer-cells show tests/format/workbooks/mixed100k.json
          python -c "from datalayer_cells import __version__; print(__version__)"
      - name: Build the wheel and the sdist (not published here)
        run: |
          python -m build --sdist --wheel --outdir dist-py .
          ls -la dist-py
