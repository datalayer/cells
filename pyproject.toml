[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalayer_cells"
dynamic = ["version"]
description = "Datalayer Cells for Python: read and write Cells workbooks, as agents do, and the `datalayer cells` command"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The reactor's PluginManifest is what the `datalayer.cli` entry point hands
# the Datalayer CLI, as datalayer_decks does.
dependencies = ["datalayer_reactor>=1.3.1", "typer>=0.12"]

[project.optional-dependencies]
# The live workbook over the collaboration document (loro-py) and the rooms' websocket.
live = ["loro>=1.10", "websockets>=12"]
test = ["pytest>=8", "loro>=1.10", "websockets>=12"]

[project.urls]
Homepage = "https://github.com/datalayer/cells"

# The command on its own: `datalayer-cells get book.cells.json A1:C4`.
[project.scripts]
datalayer-cells = "datalayer_cells.cli:main"

# The same group inside the Datalayer CLI: `datalayer cells get …`.
[project.entry-points."datalayer.cli"]
cells = "datalayer_cells.cli:plugin"

# The version lives in datalayer_cells/__version__.py; dev/bump_version.py
# moves it and package.json together (`make bump-patch`).
[tool.hatch.version]
path = "datalayer_cells/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["datalayer_cells"]

[tool.hatch.build.targets.sdist]
include = ["datalayer_cells", "tests/python", "tests/format", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
